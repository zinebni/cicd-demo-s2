name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest  # we define the runer 
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
        
      - name: Installer les dépendances
        run: npm install
      
      - name : Vérifier le code 
        run : npm run lint


      - name: Lancer les tests
        run: npm test

      - name : construire l'image docker
        run : docker build -t cicd-demo-s2 .

      - name : Demarer le conteneur docker
        run : docker run -d -p 3000:3000 --name cicd-demo cicd-demo-s2